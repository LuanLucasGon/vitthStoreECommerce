$kind: http-request
name: Create User
method: POST
url: '{{baseUrl}}/users'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "email": "john.doe@example.com",
      "password": "password123",
      "cpf": "12345678901"
    }
